<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calm Assistant</title>
<!--
  CALM VARIANT (8 Nov 2026): same data, logic and capabilities as calibrated.html, less visual load.
  One column; conversation switcher in the header; slim sticky slider; plain assumption lines; one-line
  verdict; one-line background offer; lighter timeline. calibrated.html is untouched.
-->
<!--
  FINAL PROTOTYPE (medium/high fidelity, scripted). Second iteration of the CS6750 individual project.
  One assistant, several conversations. "Foreign accounts" (FBAR) is the evaluated question; the others show the
  same design across health (an OTC drug label), an official process (passport renewal) and three IRS rules.
  Combines: stakes dial with the assistant's reading · receipt line, silent when nothing to warn · dots + source
  opening under the sentence · "what I'm assuming about you" with origin labels · chips with a visible before/after ·
  trust state + collapsed decision panel · rewind with forks · background checks with permission · hand-off with
  what to bring and where to get it.
  Deep links: #answer (evaluation link: FBAR at the answer) · #health · #passport · #roth · #wash · #est
  Every quotation is verbatim: FinCEN FBAR Line Item Filing Instructions v1.4 (Jan 2017); FDA Drug Facts label,
  Advil (ibuprofen) tablets, DailyMed setid 1a665e64-9f30-be37-4a83-38789f1f1e89, effective 3 Nov 2026; U.S.
  Department of State "Renew Your Passport by Mail", updated 1 Oct 2026; IRS Pub 590-A (2025), Pub 550 (2025),
  Form 1040-ES (2026). Background durations are compressed (one "minute" is about 5 seconds).
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout: a single assistant. Header: title, stakes dial, background tray, history. Chat column centred;
   the composer docked at the bottom with one suggested next question. */
:root{--bg:#f2f3ef;--panel:#fbfbf8;--card:#ffffff;--soft:#f6f7f3;--hov:#e4e6df;--ink:#191b1f;--ink2:#474b52;--mute:#5f635d;--faint:#a9ada4;--line:#dfe1da;--line2:#cbcec5;
 --acc:#1f3f9e;--accs:#e6ebf7;--onacc:#ffffff;--ok:#1e7a4a;--oks:#e1f1e7;--bad:#b42318;--bads:#fbe7e4;--inc:#94590a;--incs:#f8ecd6;--dat:#6b3fa0;--dats:#eee7f6;--unk:#5f635d;--unks:#ebece7;--inf:#20668a;--infs:#e0edf3;--ins:#d9efe1;
 --bgl:#6b3fa0;--bgls:#efe8f7;--s1:#1e7a4a;--s2:#94590a;--s3:#c2410c;--s4:#9b1c1c;--handbg:#fcf4f3;--handline:#ebcac6;
 --serif:"Source Serif 4",Georgia,serif;--sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--panel:#1b1e23;--card:#22262c;--soft:#1e2126;--hov:#2a2e35;--ink:#eceef0;--ink2:#c3c7cc;--mute:#959aa2;--faint:#5c6169;--line:#2c3037;--line2:#3a3f47;
 --acc:#8fa8f5;--accs:#232c45;--onacc:#0f1420;--ok:#5cc58b;--oks:#173325;--bad:#f2867a;--bads:#3a1c1a;--inc:#e3b25e;--incs:#36290f;--dat:#c3a0ef;--dats:#2c2240;--unk:#a6aab0;--unks:#272a2f;--inf:#7dc3e3;--infs:#16303c;--ins:#1c3a29;
 --bgl:#c3a0ef;--bgls:#2c2240;--s1:#5cc58b;--s2:#e3b25e;--s3:#f39465;--s4:#f2867a;--handbg:#2a1c1c;--handline:#5a2e2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--panel:#1b1e23;--card:#22262c;--soft:#1e2126;--hov:#2a2e35;--ink:#eceef0;--ink2:#c3c7cc;--mute:#959aa2;--faint:#5c6169;--line:#2c3037;--line2:#3a3f47;
 --acc:#8fa8f5;--accs:#232c45;--onacc:#0f1420;--ok:#5cc58b;--oks:#173325;--bad:#f2867a;--bads:#3a1c1a;--inc:#e3b25e;--incs:#36290f;--dat:#c3a0ef;--dats:#2c2240;--unk:#a6aab0;--unks:#272a2f;--inf:#7dc3e3;--infs:#16303c;--ins:#1c3a29;
 --bgl:#c3a0ef;--bgls:#2c2240;--s1:#5cc58b;--s2:#e3b25e;--s3:#f39465;--s4:#f2867a;--handbg:#2a1c1c;--handline:#5a2e2b;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{height:100%;display:flex;flex-direction:column}
header{flex:none;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:600 16px var(--serif)}.brand small{display:block;font:500 11px var(--sans);color:var(--mute)}
.dial{display:flex;align-items:center;gap:8px;margin-left:auto}
.dial .lab{font-size:11.5px;color:var(--mute);text-align:right;line-height:1.25}
.dial .lab b{display:block;color:var(--ink);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;border-right:1px solid var(--line);position:relative}
.seg button:last-child{border-right:0}
.seg button.on{color:var(--onacc);font-weight:600}
.seg .l1.on{background:var(--s1)}.seg .l2.on{background:var(--s2)}.seg .l3.on{background:var(--s3)}.seg .l4.on{background:var(--s4)}
.seg button.auto::after{content:"";position:absolute;left:50%;top:1px;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--acc)}
.hb{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.hb.on{border-color:var(--acc);color:var(--acc)}
.hb .dot{width:8px;height:8px;border-radius:50%;background:var(--bgl);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.3}}
.hb .cnt{background:var(--bgl);color:var(--onacc);border-radius:999px;padding:0 6px;font-size:11px;font-weight:700}
main{flex:1;min-height:0;position:relative;display:flex}
.chat{flex:1;overflow:auto;padding:8px 20px 150px}
.chatin{max-width:740px;margin:0 auto}
.side{width:360px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
.um{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:24px 0 10px}
.ub{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:80%}
.rw{border:0;background:none;color:var(--mute);font-size:11.5px;opacity:0;transition:.15s}.um:hover .rw,.rw:focus{opacity:1}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.av{width:20px;height:20px;border-radius:6px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:700 10px var(--sans)}.av.bg{background:var(--bgl)}
.sk{font:700 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}.sk1{color:var(--s1)}.sk2{color:var(--s2)}.sk3{color:var(--s3)}.sk4{color:var(--s4)}
.ans{font:16.5px/1.62 var(--serif)}
.cl{cursor:pointer;border-radius:3px}.cl:hover{background:var(--hov)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 2px 2px;vertical-align:middle}
.d-disputed{background:var(--bad)}.d-incomplete{background:var(--inc)}.d-dated{background:var(--dat)}.d-unconfirmed{background:var(--unk)}.d-inferred{background:var(--inf)}
.tag{display:inline-block;font:600 10.5px/1.6 var(--sans);padding:0 7px;border-radius:999px;margin-right:4px;white-space:nowrap}
.t-agreed{background:var(--oks);color:var(--ok)}.t-disputed{background:var(--bads);color:var(--bad)}.t-incomplete{background:var(--incs);color:var(--inc)}.t-dated{background:var(--dats);color:var(--dat)}.t-unconfirmed{background:var(--unks);color:var(--unk)}.t-inferred{background:var(--infs);color:var(--inf)}
.pop{display:block;margin:6px 0 10px;padding:6px 0 6px 12px;border-left:2px solid var(--acc);font:13.5px/1.5 var(--sans);color:var(--ink2)}
blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--line2);background:var(--panel);font:13.5px/1.5 var(--serif);color:var(--ink2);border-radius:0 8px 8px 0}
blockquote cite{display:block;font:500 11px var(--sans);font-style:normal;color:var(--mute);margin-top:3px}
.chip{display:inline;border:1px dashed var(--acc);background:var(--accs);color:var(--acc);border-radius:6px;padding:0 5px;font:inherit}
.menu{display:block;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:4px;margin:6px 0;font:13px var(--sans)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:7px}.menu button:hover{background:var(--accs)}.menu button.on{font-weight:600}
del{color:var(--bad);background:var(--bads);text-decoration-thickness:1.5px;border-radius:3px}ins{text-decoration:none;background:var(--ins);border-radius:3px}
.rc{font-size:12px;color:var(--mute);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.card h5{margin:0 0 6px;font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fact{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}.fact:first-of-type{border-top:0}
.fact .fl{min-width:160px;color:var(--ink2)}
.org{font:600 10px var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:999px}
.org.assumed{background:var(--incs);color:var(--inc)}.org.you{background:var(--oks);color:var(--ok)}.org.unknown{background:var(--unks);color:var(--unk)}
.ob{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:2px 10px;font-size:12px}.ob.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.trust{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ts{font:700 11px/1.7 var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:0 9px;border-radius:999px}
.ts-ready{background:var(--oks);color:var(--ok)}.ts-gap{background:var(--incs);color:var(--inc)}.ts-check{background:var(--bads);color:var(--bad)}.ts-hand{background:var(--ink);color:var(--bg)}
.tw{color:var(--ink2);font-size:13px}
.dbtn{border:0;background:none;color:var(--acc);font-size:12.5px;text-decoration:underline;padding:0}
.dec{display:flex;flex-direction:column;gap:8px}
.kd{border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--soft)}.kd.flip{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.kd>span{font-weight:600;font-size:12.5px}.kd em{font-style:normal;font-weight:600;font-size:11px;color:var(--bad);margin-left:4px}.kd em.same{color:var(--ok)}
.ko{font-size:12.5px;color:var(--ink2);padding:2px 0}.ko.cur{color:var(--ink)}
.nm div{font-size:12.5px;color:var(--ink2);margin:2px 0}.nm b{display:inline-block;min-width:110px;color:var(--ink)}
.hand{border:1px solid var(--handline);background:var(--handbg);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.hand h5{margin:0 0 6px;font:700 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--s4)}
.hand ul{margin:4px 0 8px 18px;padding:0}.hand p{margin:0 0 6px}.hand small{color:var(--mute)}
.dim{opacity:.55}.dimlab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:10px}
.offer label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px}.offer label small{display:block;color:var(--mute);font-size:12px}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:5px 11px;font-size:12.5px}
.btn.pri{background:var(--bgl);border-color:var(--bgl);color:var(--onacc);font-weight:600}.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pend{display:inline-block;font:600 10.5px/1.6 var(--sans);background:var(--bgls);color:var(--bgl);border-radius:999px;padding:0 7px;margin-left:3px;vertical-align:2px}
.report{border-left:4px solid var(--bgl)}
.sys{font-size:12.5px;color:var(--mute)}
.tray{position:absolute;right:16px;top:8px;width:340px;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:10px 12px;z-index:5}
.task{padding:7px 0;border-top:1px solid var(--line);font-size:13px}.task:first-of-type{border-top:0}.task small{color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--bgl);transition:width .4s linear}
.dock{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.dockin{max-width:740px;margin:0 auto}
.sg{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink2);text-align:left;margin-bottom:8px;max-width:100%}
.sg:hover{border-color:var(--acc);color:var(--acc)}.sg b{color:var(--acc);margin-right:4px}
.comp{display:flex;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:8px 8px 8px 14px}
.comp input{flex:1;border:0;outline:none;background:none}.comp button{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:6px 14px;font-weight:600}
.empty{text-align:center;margin-top:90px;color:var(--mute);font:20px var(--serif)}
.graph svg{display:block;max-width:100%}

@media (max-width:820px){.side{position:absolute;inset:0 0 0 auto;width:min(360px,100%);z-index:6;box-shadow:-10px 0 30px rgba(0,0,0,.2)}.dial .lab{display:none}.tray{width:auto;left:16px}}

.convs{width:240px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px}
.cv{display:block;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:8px 10px;margin-bottom:2px}
.cv:hover{background:var(--hov)}.cv.on{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.cv b{display:block;font-size:13px;font-weight:600}.cv span{font-size:11.5px;color:var(--mute)}
.h5{margin:0 0 8px;font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.menu-btn{display:none}
.empty small{display:block;font:13px var(--sans);margin-top:6px}
.dock{left:240px}
main.hastl .dock{right:230px}
#mstrip:empty{display:none}
#mstrip{position:sticky;top:0;z-index:4}
.mstrip{max-width:740px;margin:0 auto 6px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:10px 14px 8px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.mstrip.flash{animation:flash 1s ease}@keyframes flash{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 6px 18px rgba(0,0,0,.06)}}
.mtop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13.5px}.mfor{color:var(--mute);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtrack{padding:6px 4px 0}
#mslider{width:100%;margin:0;accent-color:var(--acc);height:26px;cursor:pointer}
.mstops{display:flex;justify-content:space-between;gap:4px}
.mst{flex:1;border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--mute);text-align:center}
.mst:first-child{text-align:left}.mst:last-child{text-align:right}
.mst b{display:block;font-weight:500}.mst.on b{color:var(--ink);font-weight:700}.mst em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--acc)}
.mshow{font-size:12.5px;color:var(--ink2);margin-top:4px}
.am.focus{box-shadow:-14px 0 0 -11px var(--acc)}
.tline{width:230px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px 140px}
.tline[hidden]{display:none}
.tlh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tlr{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:4px}
.tlr::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;border-left:2px solid var(--line2)}
.tlr.big{gap:18px}
.tls{position:relative;display:flex;gap:8px;align-items:flex-start;border:0;background:none;padding:2px;text-align:left;border-radius:8px;width:100%}
.tls:hover{background:var(--hov)}.tls.on{background:var(--accs)}
.tls .lv{flex:none;display:block;width:18px;height:18px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1.5px var(--line2);margin-top:1px}
.lv1{background:var(--card)}.lv2{background:var(--s2)}.lv3{background:var(--s3)}.lv4{background:var(--s4)}
.tls.on .lv{box-shadow:0 0 0 2.5px var(--acc)}
.tls span{font-size:12px;color:var(--ink2);line-height:1.35}.tls span b{display:block;font-size:11.5px;color:var(--ink);font-weight:600}
.tlr:not(.big) .tls{width:auto}
.tlrow{display:flex;align-items:flex-start;gap:4px}.tlrow .tls{flex:1;min-width:0}
.tlr.big .tlrow{flex-direction:column;gap:2px}.tlr.big .tlback{margin-left:30px}
.tlback{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--acc);white-space:nowrap;margin-top:1px}
.tlback:hover{border-color:var(--acc)}
.tlv{margin-bottom:12px}.tlv .pcard{margin:6px 0;padding:8px 10px}.tlv .pcard .po{font-size:13px}
.tlhint{font-size:11.5px;margin-top:12px}
.meta{flex-wrap:wrap}
.sline{font-size:12.5px;color:var(--ink2)}.sline b{color:var(--ink);font-weight:600}
.schoose{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:6px 0 4px}
.schoose .sq{grid-column:1/-1;font:600 13px var(--sans);color:var(--ink)}
.sopt{text-align:left;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 9px;font-size:12.5px}
.sopt.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--accs)}
.sopt b{display:block;font-size:13px}.sopt em{font-style:normal;font-size:11px;color:var(--acc);font-weight:600}.sopt span{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.calc table{width:100%;border-collapse:collapse;font-size:13px}.calc td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:middle}
.calc tr:first-child td{border-top:0}.calc .res td{border-top:2px solid var(--line2);font-size:14px}
.calc .cv2{white-space:nowrap}.cnote{font-size:12.5px;color:var(--ink2);margin:8px 0 4px}
.org.src{background:var(--accs);color:var(--acc)}.org.mine{background:var(--infs);color:var(--inf)}
.pcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}

.pcard .pt{font:600 13px var(--sans)}.pcard .pt em{font-style:normal;font-size:11px;color:var(--onacc);background:var(--acc);border-radius:999px;padding:1px 8px;margin-left:6px}
.pcard .pd{font-size:12.5px;color:var(--ink2)}.pcard .po{font:14px/1.4 var(--serif);color:var(--ink)}
.steps summary{cursor:pointer;font-size:12.5px;color:var(--ink2);margin-top:8px}
@media (max-width:980px){.tline{display:none}main.hastl .dock{right:0}.convs{position:absolute;inset:0 auto 0 0;z-index:7;display:none;box-shadow:10px 0 30px rgba(0,0,0,.2)}.convs.open{display:block}.menu-btn{display:inline-flex}.dock{left:0}}

:root{--bg:#fafaf8;--panel:#fafaf8;--line:#ebebe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--panel:#16181b;--line:#26292e}}
:root[data-theme="dark"]{--bg:#16181b;--panel:#16181b;--line:#26292e}
header{border-bottom:0;padding-block:12px;gap:8px 14px}
.brand{font-size:15px}.brand small{font-size:11px}
.cswitch{border:0;background:none;padding:4px 8px;border-radius:8px;font-size:13px;color:var(--ink2)}
.cswitch:hover{background:var(--hov)}
.hb{border:0;background:none;color:var(--mute);padding:4px 8px}.hb:hover{color:var(--ink);background:var(--hov)}
.hb.on{color:var(--acc)}
#dial{margin-left:auto}
.convs,.convs.open{position:absolute;top:0;left:max(16px,calc(50% - 360px));width:280px;max-height:80%;z-index:8;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 14px 40px rgba(0,0,0,.14);display:none}
.convs.open{display:block}
.dock,main.hastl .dock{left:0}
main.hastl .dock{right:200px}
.chat{padding:4px 24px 160px}
.chatin,.dockin{max-width:680px}
/* slider: one slim row */
.mstrip{max-width:680px;background:var(--bg);border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:8px 2px 8px;margin-bottom:8px}
.mstrip.flash{animation:cflash 1s ease}@keyframes cflash{0%{background:var(--accs)}100%{background:var(--bg)}}
.mrow{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--mute)}
.mrow #mslider{flex:1;height:20px}
.mcur{min-width:150px;color:var(--ink);font-weight:600;text-align:right}
.mnote{font-size:12px;color:var(--mute);margin-top:1px}
.mnote .dbtn{font-size:12px}
/* answer */
.um{margin:30px 0 12px}
.ub{background:var(--hov);color:var(--ink);border-radius:14px 14px 4px 14px}
.meta{margin-bottom:8px}
.sline{font-size:12px;color:var(--mute)}.sline b{color:var(--ink2);font-weight:600}
.ans{font-size:16.5px;line-height:1.7}
.chip{border:0;border-bottom:1.5px dashed var(--acc);background:none;border-radius:0;padding:0 1px}
.dot{width:6px;height:6px}
.card{border:0;background:none;padding:0;margin-top:16px}
.card h5,.hand h5{text-transform:none;letter-spacing:0;font:600 12.5px var(--sans);color:var(--ink2);margin-bottom:6px}
/* assumptions as plain lines */
.alist{margin-top:16px;font-size:13px;color:var(--ink2)}
.aline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:5px 0}
.aline .al{color:var(--ink2)}.aline .ao{font-size:12px;font-style:italic;color:var(--mute)}
.aline .ao.open{color:var(--inc)}
.seg2{display:inline-flex;gap:2px;flex-wrap:wrap}
.seg2 button{border:0;background:none;border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--mute)}
.seg2 button:hover{background:var(--hov);color:var(--ink)}
.seg2 button.on{background:var(--ink);color:var(--bg)}
/* one-line verdict */
.trust{margin-top:18px;gap:6px 10px;font-size:13px}
.ts{all:unset;display:inline-flex;align-items:center;gap:7px;font:600 13px var(--sans);color:var(--ink)}
.ts::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
.ts-gap::before{background:var(--inc)}.ts-check::before{background:var(--bad)}.ts-hand::before{background:var(--s4)}
.tw{color:var(--mute);font-size:13px}
.rc{font-size:12px;color:var(--mute);margin-top:6px}.rc b{font-weight:500}
.dec{margin-top:10px;padding-left:16px;border-left:2px solid var(--line)}
.kd{border:0;background:none;padding:4px 0}.kd.flip{box-shadow:none}.kd.flip>span{color:var(--bad)}
/* background offer as one line */
.oline{margin-top:14px;font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.oline .btn{border:0;background:var(--accs);color:var(--acc);font-weight:600;border-radius:999px;padding:3px 12px}
.offer{margin-top:8px;padding-left:16px;border-left:2px solid var(--line)}
.hand{background:none;border:0;border-left:2px solid var(--s4);border-radius:0;padding:2px 0 2px 14px}
.report{border-left:2px solid var(--bgl);padding-left:14px}
blockquote{background:none;border-left:2px solid var(--line2)}
.pop{border-left-width:1.5px}
.av{display:none}
/* lighter timeline */
.tline{width:200px;border-left:0;background:none;padding:14px 10px 140px}
.tlr::before{border-left:1px solid var(--line2)}
.tls .lv{width:12px;height:12px;border-width:2px;margin:3px 3px 0}
.tlr::before{left:10px}
.tls span{font-size:12px;color:var(--mute)}.tls.on span{color:var(--ink)}
.tls.on{background:none}.tls.on .lv{box-shadow:0 0 0 2px var(--acc)}
.tlback{border:0;background:none;padding:0 4px;font-size:12px;opacity:0;transition:opacity .15s}
.tlrow:hover .tlback,.tlback:focus-visible,.tlr.big .tlback{opacity:1}
.tlr.big .tlback{opacity:.7}.tlr.big .tlback:hover{opacity:1}
.tlhint{color:var(--mute)}
.pcard{border-color:var(--line);background:none}
.dock{background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.sg{border:0;background:none;padding:2px 2px;color:var(--mute)}.sg b{font-weight:600}
.comp{border-color:var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.side{border-left:1px solid var(--line)}
@media (max-width:980px){main.hastl .dock{right:0}}
.am.focus{box-shadow:-14px 0 0 -12px var(--line2)}
.h5{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink2)}
</style>

<div class="app">
 <header>
  <div class="brand">Assistant<small>Prototype · scripted · not advice</small></div>
  <button class="cswitch" id="cswitch" data-act="convs" aria-label="Switch conversation"></button>
  <div class="dial" id="dial"></div>
  <button class="hb" id="bgbtn" data-act="tray">Background checks</button>
  <button class="hb" id="hsbtn" data-act="side">History</button>

  <nav class="convs" id="convs" aria-label="Conversations"></nav>
  <div class="chat" id="chat"><div id="mstrip"></div><div class="chatin" id="chatin"></div></div>
  <nav class="tline" id="tline" aria-label="Conversation timeline"></nav>
  <aside class="side" id="side" hidden></aside>
  <div class="tray" id="tray" hidden></div>
  <div class="dock"><div class="dockin"><div id="sugg"></div><div class="comp"><input id="ta" placeholder="Message the assistant" aria-label="Message"><button data-act="send">Send</button></div></div></div>
 </main>
</div>

const clone=o=>JSON.parse(JSON.stringify(o));

 return`<div class="tlh"><span class="h5" style="margin:0">Timeline</span><button class="dbtn" data-act="tlsize">${big?'smaller':'larger'}</button></div>
 ${branched()?`<div class="tlv"><div class="sys" style="margin:0 0 2px">Your versions · click to switch</div>${pathCards()}</div>`:''}
 <div class="tlr${big?' big':''}">${a.map(i=>{const k=S().turns[i],st=stakesOf(i),q=T(k).q,bn=backNode(i);return`<div class="tlrow"><button class="tls${i===f?' on':''}" data-jump="${i}" title="${NAMES[st]}: ${q.replace(/"/g,'&quot;')}"><i class="lv lv${st}"></i>${big?`<span><b>${NAMES[st]}</b>${q.length>54?q.slice(0,52)+'…':q}</span>`:''}</button>${bn!=null?`<button class="tlback" data-go="${bn}" title="Go back to here: the conversation returns to how it was when this was answered. Change something and you get a second version; nothing is lost." aria-label="Go back to here">↺${big?' go back to here':''}</button>`:''}</div>`;}).join('')}</div>
 <p class="sys tlhint">${branched()?'':'↺ goes back to any answer. Change something from there and you get a second version; nothing is lost.'}</p>`;}
function calcCard(n){const k=S().turns[n],t=T(k);if(!t.calc)return'';const c=t.calc(S().facts),id='calc'+CV+n;
 const OL={you:'you told me',ex:'from the IRS example',src:'official source',mine:'my arithmetic'};
 return`<div class="card calc"><h5>${c.title}</h5><table>${c.rows.map(r=>`<tr><td>${r.l}</td><td class="cv2">${r.fact?C().facts[r.fact].opts.map(([v,l])=>`<button class="ob${S().facts[r.fact]===v?' on':''}" data-fact="${r.fact}=${v}">${l}</button>`).join(' '):`<b>${r.v}</b>`}</td><td><span class="org ${r.o==='src'?'src':r.o==='mine'?'mine':r.o==='ex'?'assumed':'you'}">${OL[r.o]}</span></td></tr>`).join('')}
  <tr class="res"><td>${c.res.l}</td><td colspan="2"><b>${c.res.v}</b></td></tr></table>${c.note?`<p class="cnote">${c.note}</p>`:''}
  <button class="dbtn" data-open="${id}">${UI.open[id]?'Hide the sources':'Show the sources'}</button>${UI.open[id]?[c.rows.find(r=>r.src)?.src,c.src,c.src2].filter(Boolean).map(quote).join(''):''}</div>`;}
const fq=f=>FQ[f]||('your '+C().facts[f].label.toLowerCase()+'?');
const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
function trust(n){const k=S().turns[n],cs=claimsOf(k),st=stakesOf(n),h=T(k).hand||C().hand;
 if(st===4)return['hand','Talk to a person first',h.who];
 const dis=cs.find(c=>c.m==='disputed');if(dis)return['check','Before you act, check','the official source disagrees with “'+dis.t.slice(0,58)+'…”'];
 const op=dps(k).find(d=>d.flips&&isOpen(d.f));if(op)return['check','Before you act, find out',fq(op.f)];
 if(T(k).handAt3)return['hand','Talk to a person first',h.who];
 const as=usedFacts(k).find(f=>S().origin[f]==='assumed');if(as)return['check','Before you act, confirm','I assumed '+factLabel(as,S().facts[as])];
 const gap=cs.filter(c=>c.m!=='agreed').length;if(gap)return['gap','Good to go, with '+gap+' loose end'+(gap>1?'s':''),gap+' sentence'+(gap>1?'s aren\'t':' isn\'t')+' backed by a source'];
 return['ready','Good to go','everything here matches a source'];}
function oneCheck(k){const d=dps(k).find(d=>d.flips&&isOpen(d.f));if(d)return cap(fq(d.f));
 const dis=claimsOf(k).find(c=>c.m==='disputed');return dis?'Check the sentence the official source disagrees with.':null;}
function assumeCard(k){const fs=usedFacts(k);if(!fs.length)return'';
 return`<div class="alist">${fs.map(f=>{const o=S().origin[f],ol=o==='assumed'?'I assumed':o==='unknown'?'not known yet':'you told me';
  return`<div class="aline"><span class="al">${C().facts[f].label}</span><span class="ao${o!=='you'?' open':''}">${ol}</span><span class="seg2">${C().facts[f].opts.map(([v,l])=>`<button class="${S().facts[f]===v?'on':''}" data-fact="${f}=${v}" aria-pressed="${S().facts[f]===v}">${l}</button>`).join('')}</span></div>`;}).join('')}</div>`;}
function decide(n){const k=S().turns[n],t=T(k),[cls,lab,why]=trust(n),open=UI.dec[CV+n],d=dps(k),oc=oneCheck(k),h=t.hand||C().hand;
 return`<div class="trust"><span class="ts ts-${cls}">${lab}</span><span class="tw">${why}</span>${stakesOf(n)>=3?`<button class="dbtn" data-dec="${n}">${open?'Hide':'Help me decide'}</button>`:''}</div>
 ${open?`<div class="card dec">${t.trace?`<div><h5>How I got the total</h5>${t.trace(S().facts)}</div>`:''}
  ${d.length?`<div><h5>Which facts change the answer</h5>${d.map(x=>`<div class="kd${x.flips?' flip':''}"><span>${C().facts[x.f].label}${x.flips?' <em>changes the answer</em>':' <em class="same">doesn\'t change the answer</em>'}</span>${x.outs.map(o=>`<div class="ko${S().facts[x.f]===o.v?' cur':''}"><b>If ${o.l}:</b> ${o.out}</div>`).join('')}</div>`).join('')}</div>`:''}
  ${(t.risks||[]).includes('Hard to undo')?`<div style="color:var(--s4);font-weight:600">Hard to undo: acting on this can't easily be reversed.</div>`:''}
  ${t.change?`<div><h5>Other things that could change it</h5><ul style="margin:0;padding-left:18px">${t.change.map(c=>`<li>${c}</li>`).join('')}</ul></div>`:''}
  <div class="nm"><h5>Your options</h5><div><b>Go ahead</b>${cls==='ready'?'Nothing here is unverified.':cls==='hand'?'Not recommended without a person\'s advice.':'You can, but this is still open: '+why+(why.endsWith('?')?'':'.')}</div><div><b>Find out first</b>${oc||'Nothing outstanding.'}</div><div><b>Ask an expert</b>${h.who}</div></div></div>`:''}`;}
function handCard(h){return`<div class="hand"><h5>Talk to a person first</h5>${h.say?`<p>${h.say}</p>`:''}<p><b>Who:</b> ${h.who}</p><b>Bring</b><ul>${h.bring.map((b,i)=>`<li>${b}${h.where&&h.where[i]?` <small>· get it from: ${h.where[i]}</small>`:''}</li>`).join('')}</ul><p style="margin:0"><b>Start here:</b> ${h.start}</p></div>`;}
function offer(n){const k=S().turns[n],keys=(T(k).offer||[]).filter(t=>!S().tasks[t]);if(!keys.length||stakesOf(n)<3)return'';
 const id='offer'+CV+n,mins=Math.max(...keys.map(t=>C().tasks[t].min));
 return`<div class="oline"><span>I can double-check ${keys.length===1?'one thing':keys.length+' things'} in the background (about ${mins} min, official documents only).</span><button class="btn" data-act="run">Run ${keys.length===1?'it':'them'}</button><button class="dbtn" data-open="${id}">${UI.open[id]?'hide':'choose'}</button></div>
 <div class="offer" ${UI.open[id]?'':'hidden'}>${keys.map(t=>`<label><input type="checkbox" data-task="${t}" checked><span>${C().tasks[t].t}<small>about ${C().tasks[t].min} min · I'll come back to you</small></span></label>`).join('')}</div>`;}
function answer(n){const k=S().turns[n],t=T(k),st=stakesOf(n);
 if(needsAsk(k))return`<div class="card"><div style="font:15.5px/1.5 var(--serif);margin-bottom:8px">${t.ask.prompt}</div><div class="row">${t.ask.opts.map(([v,l])=>`<button class="ob" data-answer="${t.ask.key}=${v}">${l}</button>`).join('')}</div><div class="sys" style="margin-top:6px">I'm asking because this one fact changes the answer.</div></div>`;
 const cs=claimsOf(k),running=Object.values(S().tasks).some(x=>x.status==='running')&&t.offer;
 const sentence=(c,ci)=>{const id=CV+n+'.'+ci,old=UI.before&&UI.before[n]&&c.asm?UI.before[n][c.asm]:null,txt=chipify(c);
  const body=old&&old!==c.t?`<del>${old}</del> <ins>${txt}</ins>`:txt;
  const mark=st>=2&&c.m!=='agreed'?`<span class="dot d-${c.m}" title="${MK[c.m]}"></span>`:'';
  const pend=running&&c.m==='unconfirmed'?'<span class="pend">checking…</span>':'';
  return`<span class="cl" data-open="${id}">${body}</span>${mark}${pend}${UI.open[id]?`<span class="pop">${tag(c.m)}${(c.src||[]).map(quote).join('')}${c.note?`<span>${c.note}</span>`:''}${!c.src?'<span>No source passage behind this sentence.</span>':''}</span>`:' '}`;};
 const h=t.hand||C().hand;
 if(st===4)return`${handCard(h)}<div class="dimlab">For reference, not a final answer</div><div class="dim ans">${cs.map(sentence).join('')}</div>${decide(n)}`;
 if(st===1)return`<div class="ans">${cs.map(c=>chipify(c)).join(' ')}</div>${receipt(n)}`;
 return`<div class="ans">${cs.map(sentence).join('')}</div>${calcCard(n)}${st>=3?assumeCard(k):''}${st>=3&&(t.handAt3||t.hand)?handCard(h):''}${decide(n)}${receipt(n)}${offer(n)}`;}
function report(r){const tk=(C().tasks||{})[r.k];return`<div class="meta"><span class="av bg">BG</span><b style="color:var(--ink)">Back from checking</b><span>· ${tk.t.toLowerCase()} · ${tk.tag}</span></div><div class="card report">${tk.res}${tk.q?quote(tk.q):''}${tk.q?`<div class="row"><button class="btn acc" data-dec="${r.after}">Show what it changes</button></div>`:''}</div>`;}

/* ======================= RENDER ======================= */
const $=id=>document.getElementById(id);
function graph(){const H=X().H,L=[],D=[],seen={};let nl=0;H.forEach((h,i)=>{if(i===0){L[0]=0;D[0]=0;return;}const p=h.parent;D[i]=D[p]+1;seen[p]=(seen[p]||0)+1;L[i]=seen[p]===1?L[p]:++nl;});
 const XS=36,YS=34,on=path(),W=20+Math.max(...D)*XS+20,Hh=20+nl*YS+10,pt=i=>[14+D[i]*XS,14+L[i]*YS];
 return`<svg width="${W}" height="${Hh}">${H.map((h,i)=>{if(!i)return'';const[a,b]=pt(h.parent),[c,d]=pt(i);return`<path d="M${a},${b} C${a+XS/2},${b} ${c-XS/2},${d} ${c},${d}" fill="none" style="stroke:${on.includes(i)?'var(--acc)':'var(--line2)'}" stroke-width="2"/>`;}).join('')}
 ${H.map((h,i)=>{const[x,y]=pt(i);return`<g data-go="${i}" style="cursor:pointer"><title>${h.label}</title><circle cx="${x}" cy="${y}" r="${i===X().cur?7:5}" style="fill:${on.includes(i)?'var(--acc)':'var(--card)'};stroke:${on.includes(i)?'var(--acc)':'var(--faint)'}" stroke-width="2"/></g>`;}).join('')}</svg>`;}
function outcomeOf(snap){let best=null;snap.turns.forEach(k=>{const t=T(k);if(t.ask&&snap.origin[t.ask.key]==='unknown')return;if(!best||t.st>=T(best).st)best=k;});return best==null?'No answer yet':T(best).short(snap.facts);}
function pathCards(){const H=X().H,leaves=H.map((h,i)=>i).filter(i=>!kids(i).length);
 return leaves.map((i,ix)=>{const sn=H[i].snap,set=Object.keys(sn.origin).filter(f=>sn.origin[f]==='you'&&!C().facts[f].said).map(f=>`${C().facts[f].label}: <b>${factLabel(f,sn.facts[f])}</b>`);
  const here=i===X().cur||(path(i).includes(X().cur)&&kids(X().cur).length<=1);
  return`<button class="pcard${here?' here':''}" data-go="${i}"><span class="pt">Version ${ix+1}${here?' <em>you are here</em>':''}</span><span class="pd">${set.length?set.join('<br>'):'Nothing changed by you'}</span><span class="po">${outcomeOf(sn)}</span></button>`;}).join('');}
function sideHTML(){const list=[];(function rec(i,d){list.push([i,d]);kids(i).forEach((k,j)=>rec(k,j?d+1:d));})(0,0);
 return`<h5 class="h5">History</h5>${branched()?`<p class="sys">You have two versions of this conversation. Click one to switch; nothing is lost.</p>${pathCards()}<details class="steps"><summary>All steps</summary>`:`<p class="sys">Every step is saved. Click any step to go back to it. If you change something from there, you'll get a second version, and the first one is kept.</p>`}
 ${list.map(([i,d])=>`<button class="ob${i===X().cur?' on':''}" style="display:block;width:calc(100% - ${d*14}px);margin:4px 0 0 ${d*14}px;text-align:left;border-radius:8px;${path().includes(i)?'':'opacity:.55'}" data-go="${i}">${X().H[i].label}</button>`).join('')}${branched()?'</details>':''}`;}
function trayHTML(){const ts=Object.entries(S().tasks);
 return`<b style="font-size:13px">Background checks</b>${ts.length?ts.map(([k,t])=>{const p=Math.min(1,(Date.now()-t.start)/(t.dur*1000));return`<div class="task">${(C().tasks||{})[k].t}<br><small>${t.status==='done'?'Done · reported back':'Running · about '+Math.max(1,Math.ceil((C().tasks||{})[k].min*(1-p)))+' min left'}</small><div class="bar"><i style="width:${t.status==='done'?100:p*100}%"></i></div></div>`;}).join(''):'<p class="sys">Nothing running in this conversation. I offer checks when an answer would benefit from one.</p>'}`;}
function render(){
 const n=lastN(),st=S().turns.length?stakesOf(n):null,auto=S().turns.length?T(S().turns[n]).st:null;
 $('convs').innerHTML=`<h5 class="h5">Switch conversation</h5>`+Object.entries(SCN).map(([id,s])=>`<button class="cv${id===CV?' on':''}" data-conv="${id}"><b>${s.title}</b><span>${s.cat} · ${s.sub}</span></button>`).join('');
 $('convs').classList.toggle('open',UI.convs);$('cswitch').innerHTML=`${C().title} <span style="color:var(--mute)">▾</span>`;
 $('dial').innerHTML='';
 const running=Object.values(S().tasks).filter(t=>t.status==='running').length;
 $('bgbtn').innerHTML=`${running?'<span class="dot"></span>':''}Background checks${running?` <span class="cnt">${running} running</span>`:''}`;$('bgbtn').classList.toggle('on',UI.tray);
 $('hsbtn').innerHTML=`History${branched()?' <span class="cnt" style="background:var(--acc)">branched</span>':''}`;$('hsbtn').classList.toggle('on',UI.side);
 renderChat();
 $('mstrip').innerHTML=stripHTML();$('tline').innerHTML=tlineHTML();$('tline').hidden=!answeredIdx().length;$('main').classList.toggle('hastl',answeredIdx().length>0);
 const nq=nextK()<C().turns.length?T(nextK()).q:null;
 $('sugg').innerHTML=nq?`<button class="sg" data-act="suggest"><b>Suggested ›</b>${nq.length>100?nq.slice(0,98)+'…':nq}</button>`:'';
 $('tray').hidden=!UI.tray;if(UI.tray)$('tray').innerHTML=trayHTML();
 $('side').hidden=!UI.side;if(UI.side)$('side').innerHTML=sideHTML();}
function renderChat(){const f=focusN();
 $('chatin').innerHTML=S().turns.length?S().turns.map((k,i)=>{const anc=path().find(j=>X().H[j].snap.turns.length===i);
   return`<div class="um">${anc!=null?`<button class="rw" data-go="${anc}">↺ rewind to before this</button>`:''}<div class="ub">${T(k).q}</div></div>
   <div class="am${i===f&&answeredIdx().length>1?' focus':''}" id="ans-${i}"><div class="meta"><span class="av">AI</span>${needsAsk(k)?'':stakesLine(i)}</div>${answer(i)}</div>
   ${S().reports.filter(r=>r.after===i).map(report).join('')}`;}).join(''):`<p class="empty">How can I help?<small>${C().title} · ${C().cat}</small></p>`;}
let PLAY=true;
function send(){const k=nextK();if(k>=C().turns.length)return;S().turns.push(k);S().stakes=null;commit('Asked: '+T(k).q.split(' ').slice(0,4).join(' ')+'…');
 setTimeout(()=>{const c=$('chat');const ums=c.querySelectorAll('.um');const u=ums[ums.length-1];if(u)c.scrollTo({top:u.offsetTop-12,behavior:PLAY?'auto':'smooth'});},30);}
function setFact(f,v){UI.before={};S().turns.forEach((k,i)=>{UI.before[i]={};claimsOf(k).forEach(c=>{if(c.asm)UI.before[i][c.asm]=c.t;});});
 S().facts[f]=v;S().origin[f]='you';UI.menu=null;commit(C().facts[f].label+': '+factLabel(f,v));}
function tick(){let ch=false;for(const id in ST){const s=ST[id].s;for(const[k,t]of Object.entries(s.tasks)){if(t.status==='running'&&Date.now()-t.start>=t.dur*1000){t.status='done';s.reports.push({k,after:s.turns.length-1});ST[id].H[ST[id].cur].snap=clone(s);ch=true;}}}
 if(ch)render();else if(UI.tray&&Object.values(S().tasks).some(t=>t.status==='running'))$('tray').innerHTML=trayHTML();}
document.addEventListener('click',e=>{if(UI.convs&&!e.target.closest('#convs,#cswitch')){UI.convs=false;render();}const el=e.target.closest('[data-act],[data-open],[data-menu],[data-fact],[data-stakes],[data-focus],[data-jump],[data-dec],[data-go],[data-answer],[data-conv]');if(!el)return;const d=el.dataset;
 if(d.conv){CV=d.conv;UI.open={};UI.menu=null;UI.before=null;UI.convs=false;return render();}
 if(d.menu){UI.menu=UI.menu===d.menu?null:d.menu;return render();}
 if(d.fact){const[f,v]=d.fact.split('=');if(S().facts[f]===v){UI.menu=null;return render();}return setFact(f,v);}
 if(d.open){UI.open[d.open]=!UI.open[d.open];return render();}
 if(d.stakes){const[n,v]=d.stakes.split(':');S().stakesAt=S().stakesAt||{};if(v==='auto')delete S().stakesAt[n];else S().stakesAt[n]=+v;UI.sopen={};return commit(v==='auto'?'Back to my suggestion':'Set to: '+NAMES[+v].toLowerCase());}
 if(d.focus!=null){UI.focus=UI.focus||{};UI.focus[CV]=+d.focus;UI.sopen=UI.sopen||{};const key=CV+d.focus,was=UI.sopen[key];UI.sopen={};if(!was)UI.sopen[key]=true;render();const m=document.querySelector('.mstrip');if(m){m.classList.remove('flash');void m.offsetWidth;m.classList.add('flash');}return;}
 if(d.jump!=null){UI.focus=UI.focus||{};UI.focus[CV]=+d.jump;render();const a=$('ans-'+d.jump);if(a)$('chat').scrollTo({top:a.offsetTop-(document.querySelector('.mstrip')?.offsetHeight||0)-60,behavior:'smooth'});return;}
 if(d.dec!=null){UI.dec[CV+d.dec]=!UI.dec[CV+d.dec];return render();}
 if(d.go!=null)return go(+d.go);
 if(d.answer){const[f,v]=d.answer.split('=');S().facts[f]=v;S().origin[f]='you';return commit('Answered: '+factLabel(f,v));}
 const a=d.act;
 if(a==='tlsize'){const big=UI.tlBig!=null?UI.tlBig:(answeredIdx().length>=3||branched());UI.tlBig=!big;return render();}
 if(a==='suggest'||a==='send'){$('ta').value='';UI.focus=UI.focus||{};delete UI.focus[CV];return send();}
 if(a==='tray'){UI.tray=!UI.tray;return render();}
 if(a==='side'){UI.side=!UI.side;return render();}
 if(a==='convs'){UI.convs=!UI.convs;return render();}
 if(a==='run'){document.querySelectorAll('.offer input[data-task]:checked').forEach(cb=>{S().tasks[cb.dataset.task]={start:Date.now(),dur:C().tasks[cb.dataset.task].min*SPEED,status:'running'};});return commit('Started background checks');}});
document.addEventListener('input',e=>{if(e.target.id!=='mslider')return;const n=focusN(),v=+e.target.value;S().stakesAt=S().stakesAt||{};S().stakesAt[n]=v;renderChat();
 document.querySelectorAll('.mst').forEach((b,i)=>b.classList.toggle('on',i+1===v));$('mshow').textContent='Shows '+SHOWS[v]+'.';if($('mcur'))$('mcur').textContent=NAMES[v];e.target.setAttribute('aria-valuetext',NAMES[v]);});
document.addEventListener('change',e=>{if(e.target.id!=='mslider')return;const v=+e.target.value,had=document.activeElement===e.target;commit('Set to: '+NAMES[v].toLowerCase());if(had){const m=$('mslider');if(m)m.focus();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ta'){e.preventDefault();$('ta').value='';send();}if(e.key==='Escape'&&UI.menu){UI.menu=null;render();}});
setInterval(tick,300);
/* deep links: #answer (the evaluation link) · #health · #passport · #roth · #wash · #est · ?at= also accepted */
const at=new URLSearchParams(location.search).get('at')||location.hash.slice(1);
if(at==='answer'||at==='resid'||at==='critical'){send();send();if(at!=='answer'){send();send();}if(at==='critical'){S().facts.resid='unsure';S().origin.resid='you';commit('Answered: not sure');send();}}
else if(SCN[at]){CV=at;}
render();PLAY=false;
</script>
